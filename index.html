<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ballet Coach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<title>Ballet AI Coach</title>
<style>
/* Layout: camera stage on the left, live checks + last-rep analysis + log on the right; stacks on phones */
/* White page and cards; pink only for the dancer and the accent (buttons, titles). One light look on purpose. */
:root{
  --bg:#ffffff; --tint:#faf6f8; --surface:#ffffff; --fg:#4a2a3a; --muted:#8a6577; --line:#efe4e9;
  --accent:#cf3577; --accent-soft:#ffe3ee; --accent-ink:#ffffff; --ok:#239063; --bad:#dc3550; --na:#d9c3cd;
  --ph-flat:#7aa7e0; --ph-demi:#f2b33d; --ph-point:#b05ad6; --ph-off:#dc3550; --ph-up:#3fb39b;
  --font:"Nunito","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --display:"Fredoka","Nunito","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--font);padding:16px}
header{max-width:1200px;margin:0 auto 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
h1{font-family:var(--display);font-weight:600;font-size:24px;margin:0;letter-spacing:.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--accent)}
h1 .mini-dancer{width:56px;height:63px;flex:none;margin:-8px -4px -8px -8px}
h2{font-family:var(--display);font-weight:600}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:center}
.lang button{border:0;border-radius:0;padding:5px 12px;font-size:13px}
.lang button[aria-pressed="true"],.lang button[aria-pressed="true"]:hover{background:var(--accent);color:var(--accent-ink)}
main{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.stage{position:relative;background:#2b1a24;border-radius:20px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage.mirror video,.stage.mirror canvas{transform:scaleX(-1)}
.placeholder{color:#cfc8d8;text-align:center;padding:20px;font-size:14px;z-index:1;white-space:pre-line}
.chips{position:absolute;left:10px;top:10px;z-index:2;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.chip{background:rgba(0,0,0,.6);color:#fff;border-radius:8px;padding:4px 10px;font-size:15px;font-weight:600;display:flex;gap:8px;align-items:center}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--c,#999);display:inline-block}
.chip small{font-weight:400;opacity:.8;font-size:12px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
button,select,label.btn{font:inherit;font-size:14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button:not(.primary):not(.link):hover{background:var(--tint)}
button:focus-visible,select:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.status{font-size:13px;color:var(--muted);margin-top:8px;min-height:1.5em}
.ctl-groups{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:stretch}
.ctl-group{background:var(--tint);border:1px solid var(--line);border-radius:22px;padding:8px 10px 10px;display:grid;gap:6px;align-content:start;min-width:0}
.ctl-label{font-size:12px;font-weight:700;color:var(--muted);padding-left:6px}
.ctl-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctl-row button,.ctl-row select,.ctl-row label.btn{padding:6px 11px;font-size:13.5px}
.ctl-group{padding:7px 8px 8px}
h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-weight:400;color:var(--muted);font-size:12px;text-align:right}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checks li{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-radius:14px;border:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--na)}
.checks li[data-s="ok"] .dot{background:var(--ok)}
.checks li[data-s="bad"] .dot{background:var(--bad)}
.checks li[data-s="bad"]{border-color:var(--bad)}
.checks .name{font-weight:600}
.checks .hint{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.checks .val{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);text-align:right;max-width:13em}
.checks li[data-s="bad"] .val{color:var(--bad)}
.timeline{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--tint);position:relative;margin:4px 0 2px}
.timeline span{height:100%}
.timeline .peak{position:absolute;top:0;bottom:0;width:2px;background:var(--fg)}
.tl-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:14px;height:6px;border-radius:2px;margin-right:5px;vertical-align:middle;background:var(--c)}
.note{font-size:12px;color:var(--muted);margin:6px 0 10px}
.meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.meta b{color:var(--fg);font-size:20px;font-variant-numeric:tabular-nums;margin-right:4px}
.reps{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px;max-height:220px;overflow:auto}
.reps li{padding:6px 10px;border-radius:12px;background:var(--tint)}
.reps .good{color:var(--ok);font-weight:600}
.reps .err{color:var(--bad)}
.side{display:grid;gap:16px;align-content:start;min-width:0}
details summary{cursor:pointer;font-weight:600}
.group{font-size:12px;color:var(--muted);margin:14px 0 0;border-top:1px solid var(--line);padding-top:8px}
.slider{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-top:10px;font-size:13px}
.slider input[type=range],.slider select{grid-column:1/-1;width:100%}
.slider output{font-variant-numeric:tabular-nums;color:var(--muted)}
.tips{font-size:13px;color:var(--muted);margin:0;padding-left:18px}
.tips li{margin:3px 0}
.empty{color:var(--muted);font-size:13px}
.frame-guide{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;max-width:min(86%,520px);
  background:rgba(255,255,255,.94);color:var(--fg);border-radius:20px;padding:14px 20px;text-align:center;
  font-family:var(--display);font-weight:600;font-size:clamp(16px,2.6vw,24px);line-height:1.35;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.frame-guide small{display:block;font-family:var(--font);font-weight:400;font-size:14px;color:var(--muted);margin-top:4px}
.rec-chip{position:absolute;right:10px;top:10px;z-index:2}
.rec-chip i{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.rec-chip i{animation:none}}
button.rec-btn{border-color:var(--bad);color:var(--bad)}
button.rec-btn.on{background:var(--bad);color:#fff}
.recs{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.recs li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 10px;border-radius:14px;background:var(--tint);font-size:13px}
.recs .info{flex:1 1 140px;min-width:0;font-variant-numeric:tabular-nums}
.recs .info small{display:block;color:var(--muted);font-size:12px}
.recs button{padding:3px 10px;font-size:12px}
.recs li.empty{background:none;display:block}
.acct .row{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.acct input{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);color:var(--fg);flex:1 1 160px;min-width:0}
.acct input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.acct select{flex:1 1 160px}
.acct label{display:block;font-size:12px;color:var(--muted);margin-top:10px}
.acct .who{flex:1 1 auto;font-size:13px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
#syncState.ok{color:var(--ok)}
#syncState.err{color:var(--bad)}
/* ---------- sign-in gate ---------- */
#gate{display:none}
body.show-gate > header, body.show-gate > main, body.show-gate #report, body.show-gate #moveBar, body.show-gate .tabs{display:none!important}
body.show-gate{background:#ffffff}
body.show-gate #gate{display:flex;min-height:100vh;align-items:center;justify-content:center;padding-block:24px}
.gate-card{width:100%;max-width:360px;background:#ffffff;padding:20px 8px 26px;position:relative;text-align:center}
.gate-card .lang{position:absolute;top:0;right:0}
.gate-card .lang button{padding:3px 10px;font-size:12px}
.dancer-hero{width:200px;height:213px;display:block;margin:8px auto 0}
.brand{font-family:var(--display);font-weight:700;font-size:30px;color:var(--accent);margin:2px 0 18px;justify-content:center}
.gate-step{display:grid;gap:12px}
.gate-step input{font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:999px;padding:12px 18px;background:#ffffff;color:var(--fg);width:100%;text-align:center}
.gate-step input::placeholder{color:#b9a3ae}
.gate-step input:focus-visible{outline:none;border-color:var(--accent);background:#fff}
#code{letter-spacing:.35em;font-variant-numeric:tabular-nums;font-size:20px}
button.wide{width:100%;padding:13px;font-size:17px;font-family:var(--display);font-weight:600}
.gate-hint{color:var(--muted);font-size:13px;margin:0}
.gate-links{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
button.link{border:0;background:none;color:var(--accent);padding:2px 0;font-size:13px;box-shadow:none}
button.link:disabled{color:var(--muted)}
.gate-msg{color:var(--bad);font-size:13px;margin:12px 0 0;min-height:1em}
.gate-msg.ok{color:var(--ok)}
.gate-dots{display:flex;gap:8px;justify-content:center;padding:10px}
.gate-dots i{width:9px;height:9px;border-radius:50%;background:var(--accent);opacity:.3;animation:dot 1.2s infinite}
.gate-dots i:nth-child(2){animation-delay:.2s}.gate-dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{40%{opacity:1;transform:translateY(-3px)}}
.d-bob{animation:bob 3s ease-in-out infinite;transform-origin:120px 240px}
@keyframes bob{50%{transform:translateY(-4px) rotate(-1.5deg)}}
.d-tw{animation:twinkle 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.d-tw2{animation-delay:.8s}.d-tw3{animation-delay:1.6s}
@keyframes twinkle{50%{opacity:.35;transform:scale(.75)}}
@media (prefers-reduced-motion:reduce){.d-bob,.d-tw,.gate-dots i{animation:none}}
/* ---------- views: one of Learn / Practice / Diary / Me is visible ---------- */
#learn, #diary, #me, #moveBar{display:none}
body:not(.view-practice) > main{display:none}
body.view-learn #learn, body.view-diary #diary, body.view-me #me{display:block}
body.view-learn #moveBar, body.view-practice #moveBar{display:flex}
body.show-gate #learn, body.show-report #learn, body.show-gate #diary, body.show-report #diary, body.show-gate #me, body.show-report #me, body.show-report #moveBar{display:none!important}
/* ---------- tab bar: in the header on wide screens, fixed at the bottom on phones ---------- */
header .tabs{display:flex;gap:4px;background:var(--tint);border-radius:999px;padding:4px;align-self:center}
header .tabs button{border:0;background:none;padding:6px 14px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
header .tabs button svg{width:18px;height:18px;flex:none}
header .tabs button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 4px rgba(74,42,58,.12)}
@media (max-width:820px){
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  header .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  header .tabs button{flex:1 1 0;flex-direction:column;gap:2px;padding:4px 2px;font-size:12px;border-radius:14px;min-width:0}
  header .tabs button svg{width:24px;height:24px}
  header .tabs button[aria-pressed="true"]{box-shadow:none;background:var(--accent-soft)}
  header{margin-bottom:10px}
  h1{font-size:21px}
}
/* ---------- move picker ---------- */
.move-bar{max-width:1200px;margin:0 auto 14px;gap:8px;overflow-x:auto;padding:2px 2px 6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.move-bar button{flex:none;display:flex;align-items:center;gap:6px;padding:4px 14px 4px 4px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-weight:700;color:var(--fg);scroll-snap-align:start;white-space:nowrap}
.move-bar .thumb{width:40px;height:40px;border-radius:50%;background:var(--tint);display:grid;place-items:center;overflow:hidden;flex:none}
.move-bar .thumb svg{width:40px;height:44px;display:block}
.move-bar button[aria-pressed="true"],.move-bar button[aria-pressed="true"]:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.move-bar button[aria-pressed="true"] .thumb{background:#fff}
/* ---------- Me page ---------- */
.me-wrap{max-width:1000px;margin:0 auto;display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
.me-wrap > .full{grid-column:1/-1}
@media (max-width:820px){.me-wrap{grid-template-columns:1fr}}
.set-group{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.set-group:first-of-type{border-top:0;margin-top:4px}
.set-group > summary{font-family:var(--display);font-weight:600;font-size:15px}
.diary-wrap{max-width:1000px;margin:0 auto;display:grid;gap:16px}
.d-alert{background:#fff4f5;border:1.5px solid var(--bad);border-radius:18px;padding:12px 16px;color:var(--fg)}
.d-alert p{margin:4px 0}
.d-alert b{color:var(--bad)}
.d-form{display:grid;gap:10px}
.d-form h3{margin:6px 0 0;font-size:16px}
.d-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.d-row label{font-weight:700}
.d-row input[type=date]{font:inherit;border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--fg);background:var(--surface)}
.faces{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.faces button{border-radius:16px;padding:6px 2px;display:grid;justify-items:center;gap:2px;border:2px solid var(--line);background:var(--surface)}
.faces button svg{width:100%;max-width:46px;height:auto}
.faces button span{font-size:11px;line-height:1.2;color:var(--muted)}
.faces button[aria-pressed="true"]{background:var(--pc);border-color:var(--accent)}
.faces button[aria-pressed="true"] span{color:var(--fg);font-weight:700}
.dchips{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.chip-btn[aria-pressed="true"],.chip-btn:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip-btn input{accent-color:var(--accent)}
#dNote{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:14px;padding:8px 12px;resize:vertical;color:var(--fg);background:var(--surface)}
.d-row2{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:1.5em}
.d-msg{margin:0;font-size:13px;color:var(--bad)}
.d-msg.ok{color:var(--ok)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:8px}
.cal-h{font-size:11px;color:var(--muted);text-align:center}
.cal-d{aspect-ratio:1;border-radius:10px;border:1px solid transparent;padding:0;font-size:12px;font-variant-numeric:tabular-nums;position:relative;color:var(--fg)}
.cal-d.empty{background:var(--surface);border:1px dashed var(--line);color:var(--muted)}
.cal-d.today{outline:2px solid var(--accent);outline-offset:1px}
.cal-d i{position:absolute;right:3px;top:1px;font-size:9px;font-style:normal}
.cal.big{max-width:560px}
.cal.big .cal-d{font-size:12px;aspect-ratio:auto;height:30px;border-radius:8px}
.cal-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-bottom:8px}
.cal-legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-2px}
.ins{margin:0 0 12px;padding-left:18px;font-size:14px;display:grid;gap:4px}
.risk-item{border-left:4px solid var(--ph-demi);background:var(--tint);border-radius:0 12px 12px 0;padding:8px 12px;margin-bottom:8px}
.risk-item .cnt{color:var(--muted);font-size:13px;margin-left:8px}
.risk-item p{margin:4px 0 0;font-size:13px}
.tbl-wrap{overflow-x:auto}
.dtable{border-collapse:collapse;font-size:13px;width:100%}
.dtable th,.dtable td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.pdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
@media (max-width:420px){.faces{grid-template-columns:repeat(3,minmax(0,1fr))}}
.learn-wrap{max-width:1000px;margin:0 auto;display:grid;gap:16px}
.learn-intro h2{font-size:24px;margin:0 0 4px;color:var(--accent);display:block}
.learn-intro p{margin:0;color:var(--muted);max-width:60ch}
.dir-tabs{display:flex;gap:8px;flex-wrap:wrap}
.dir-tabs button{padding:8px 18px;font-weight:700}
.dir-tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.learn-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.learn-grid{grid-template-columns:1fr}}
.anim-card{position:relative}
.view-badge{position:absolute;left:14px;top:14px;font-size:12px;font-weight:700;color:var(--muted);background:var(--tint);border-radius:999px;padding:2px 10px}
.anim-stage svg{width:100%;max-width:400px;height:auto;display:block;margin:0 auto}
.phase-track{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.phase-track span{padding:4px 14px;border-radius:999px;font-size:13px;font-weight:700;background:var(--tint);color:var(--muted);transition:background .2s,color .2s}
.phase-track span.on{color:#fff;background:var(--c)}
.anim-caption{text-align:center;font-family:var(--display);font-size:19px;margin:10px 0 8px;min-height:1.5em}
.anim-ctl{display:flex;justify-content:center}
.learn-wrap h3{font-family:var(--display);font-weight:600;font-size:19px;margin:8px 0 0}
.card h3{margin:0 0 12px}
.tips-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.tips-list li{padding-left:30px;position:relative}
.tips-list li::before{content:"✓";position:absolute;left:0;top:1px;width:21px;height:21px;border-radius:50%;background:var(--ok);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:760px){.steps{grid-template-columns:repeat(5,150px);overflow-x:auto;padding-bottom:6px}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;text-align:center}
.step svg{width:100%;height:auto;display:block}
.step .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:13px;margin-top:2px}
.step p{margin:6px 0 0;font-size:13px}
.mistakes{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:12px}
@media (max-width:760px){.mistakes{grid-template-columns:1fr}}
.mistake{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mistake figure{margin:0;text-align:center}
.mistake svg{width:100%;height:auto;display:block}
.mistake figcaption{font-size:14px;font-weight:700}
.mistake .bad{color:var(--bad)}
.mistake .good{color:var(--ok)}
.learn-cta{display:flex;justify-content:center;padding:8px 0 28px}
.learn-cta button{max-width:360px}
.exports{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.exports button{padding:4px 10px;font-size:12px}
.exports small{flex-basis:100%;color:var(--muted);font-size:12px}

/* ---------- report ---------- */
#report{display:none}
body.show-report > header, body.show-report > main{display:none!important}
body.show-report #report{display:block}
.rp-bar{max-width:880px;margin:0 auto 12px;display:flex;justify-content:space-between;gap:8px}
.rp{max-width:880px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 28px 20px}
.rp h1{font-family:var(--display);font-size:26px;margin:0 0 4px;color:var(--accent)}
.rp h2{font-size:17px;margin:28px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--accent);display:block}
.rp .sub{color:var(--muted);font-size:13px;margin:0}
.rp-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .v small{font-size:13px;font-weight:400;color:var(--muted);margin-left:4px}
.focus{display:grid;gap:10px}
.focus .item{border-left:4px solid var(--bad);padding:6px 12px;background:var(--tint);border-radius:0 8px 8px 0}
.focus .item b{font-size:15px}
.focus .item .cnt{color:var(--bad);font-size:13px;margin-left:8px;font-variant-numeric:tabular-nums}
.focus .item p{margin:4px 0 0;font-size:13px}
.good-msg{background:var(--tint);border-radius:8px;padding:10px 12px;color:var(--ok);font-weight:600}
.rates{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr) 7.5em;gap:6px 10px;align-items:center;font-size:13px}
.rates .bar{height:10px;background:var(--tint);border-radius:4px;overflow:hidden}
.rates .bar span{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.rates .pct{font-variant-numeric:tabular-nums;text-align:right}
.rates .pct.low{color:var(--bad);font-weight:600}
.trend svg{width:100%;height:auto;display:block}
.trend .cap{font-size:13px;font-weight:600;margin:0 0 4px}
.heat-wrap{overflow-x:auto;margin-top:16px}
.heat{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.heat th,.heat td{padding:4px 8px;text-align:center;border:2px solid var(--surface)}
.heat th:first-child,.heat td:first-child{text-align:left;white-space:nowrap}
.heat th{color:var(--muted);font-weight:400}
.rp-rep{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;break-inside:avoid}
.rp-rep .hd{display:flex;justify-content:space-between;gap:8px;font-weight:600;margin-bottom:8px;flex-wrap:wrap}
.rp-rep .hd .ok{color:var(--ok)}
.rp-rep .hd .bad{color:var(--bad)}
.snaps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}
.snaps figure{margin:0}
.snaps img{width:100%;border-radius:6px;display:block;background:#000}
.snaps figcaption{font-size:11px;color:var(--muted);text-align:center;margin-top:2px}
.rp-rep ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.rp-rep ul .v{color:var(--bad);margin-left:6px}
.rp-rep .pass{font-size:13px;color:var(--ok);margin-top:6px}
.rp-foot{margin-top:24px;font-size:11px;color:var(--muted);text-align:center}
.note-sm{font-size:12px;color:var(--muted)}
@media print{
  :root{--bg:#fff;--tint:#faf6f8;--surface:#fff;--fg:#4a2a3a;--muted:#8a6577;--line:#efe4e9;--accent:#cf3577;--ok:#239063;--bad:#dc3550;
        --ph-flat:#7aa7e0;--ph-demi:#f2b33d;--ph-point:#b05ad6;--ph-off:#dc3550;color-scheme:light}
  @page{size:A4;margin:12mm}
  body{background:#fff;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .no-print{display:none!important}
  .rp{border:0;padding:0;max-width:none}
  .rp h2{break-after:avoid}
}
</style>
