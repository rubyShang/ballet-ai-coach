<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ballet Coach">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<title>Ballet AI Coach</title>
<style>
/* Layout: camera stage on the left, live checks + last-rep analysis + log on the right; stacks on phones */
/* White page and cards; pink only for the dancer and the accent (buttons, titles). One light look on purpose. */
:root{
  --bg:#ffffff; --tint:#faf6f8; --surface:#ffffff; --fg:#4a2a3a; --muted:#8a6577; --line:#efe4e9;
  --accent:#cf3577; --accent-soft:#ffe3ee; --accent-ink:#ffffff; --ok:#239063; --bad:#dc3550; --na:#d9c3cd;
  --ph-flat:#7aa7e0; --ph-demi:#f2b33d; --ph-point:#b05ad6; --ph-off:#dc3550; --ph-up:#3fb39b;
  --font:"Nunito","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --display:"Fredoka","Nunito","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--font);padding:16px}
header{max-width:1200px;margin:0 auto 14px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
h1{font-family:var(--display);font-weight:600;font-size:24px;margin:0;letter-spacing:.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--accent)}
h1 .mini-dancer{width:56px;height:63px;flex:none;margin:-8px -4px -8px -8px}
h2{font-family:var(--display);font-weight:600}
h1 .module{font-family:var(--font);font-size:13px;font-weight:700;color:var(--accent);background:var(--tint);border-radius:999px;padding:2px 12px;letter-spacing:0}
header p{margin:0;color:var(--muted);font-size:13px;flex:1 1 300px}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;align-self:center}
.lang button{border:0;border-radius:0;padding:5px 12px;font-size:13px}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
main{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.stage{position:relative;background:#2b1a24;border-radius:20px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage.mirror video,.stage.mirror canvas{transform:scaleX(-1)}
.placeholder{color:#cfc8d8;text-align:center;padding:20px;font-size:14px;z-index:1;white-space:pre-line}
.chips{position:absolute;left:10px;top:10px;z-index:2;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.chip{background:rgba(0,0,0,.6);color:#fff;border-radius:8px;padding:4px 10px;font-size:15px;font-weight:600;display:flex;gap:8px;align-items:center}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--c,#999);display:inline-block}
.chip small{font-weight:400;opacity:.8;font-size:12px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
button,select,label.btn{font:inherit;font-size:14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button:not(.primary):not(.link):hover{background:var(--tint)}
button:focus-visible,select:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.status{font-size:13px;color:var(--muted);margin-top:8px;min-height:1.5em}
h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 small{font-weight:400;color:var(--muted);font-size:12px;text-align:right}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checks li{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-radius:14px;border:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--na)}
.checks li[data-s="ok"] .dot{background:var(--ok)}
.checks li[data-s="bad"] .dot{background:var(--bad)}
.checks li[data-s="bad"]{border-color:var(--bad)}
.checks .name{font-weight:600}
.checks .hint{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.checks .val{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);text-align:right;max-width:13em}
.checks li[data-s="bad"] .val{color:var(--bad)}
.timeline{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--tint);position:relative;margin:4px 0 2px}
.timeline span{height:100%}
.timeline .peak{position:absolute;top:0;bottom:0;width:2px;background:var(--fg)}
.tl-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:14px;height:6px;border-radius:2px;margin-right:5px;vertical-align:middle;background:var(--c)}
.note{font-size:12px;color:var(--muted);margin:6px 0 10px}
.meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.meta b{color:var(--fg);font-size:20px;font-variant-numeric:tabular-nums;margin-right:4px}
.reps{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px;max-height:220px;overflow:auto}
.reps li{padding:6px 10px;border-radius:12px;background:var(--tint)}
.reps .good{color:var(--ok);font-weight:600}
.reps .err{color:var(--bad)}
.side{display:grid;gap:16px;align-content:start;min-width:0}
details summary{cursor:pointer;font-weight:600}
.group{font-size:12px;color:var(--muted);margin:14px 0 0;border-top:1px solid var(--line);padding-top:8px}
.slider{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-top:10px;font-size:13px}
.slider input[type=range],.slider select{grid-column:1/-1;width:100%}
.slider output{font-variant-numeric:tabular-nums;color:var(--muted)}
.tips{font-size:13px;color:var(--muted);margin:0;padding-left:18px}
.tips li{margin:3px 0}
.empty{color:var(--muted);font-size:13px}
.frame-guide{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;max-width:min(86%,520px);
  background:rgba(255,255,255,.94);color:var(--fg);border-radius:20px;padding:14px 20px;text-align:center;
  font-family:var(--display);font-weight:600;font-size:clamp(16px,2.6vw,24px);line-height:1.35;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.frame-guide small{display:block;font-family:var(--font);font-weight:400;font-size:14px;color:var(--muted);margin-top:4px}
.rec-chip{position:absolute;right:10px;top:10px;z-index:2}
.rec-chip i{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.rec-chip i{animation:none}}
button.rec-btn{border-color:var(--bad);color:var(--bad)}
button.rec-btn.on{background:var(--bad);color:#fff}
.recs{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.recs li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 10px;border-radius:14px;background:var(--tint);font-size:13px}
.recs .info{flex:1 1 140px;min-width:0;font-variant-numeric:tabular-nums}
.recs .info small{display:block;color:var(--muted);font-size:12px}
.recs button{padding:3px 10px;font-size:12px}
.recs li.empty{background:none;display:block}
.acct .row{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.acct input{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);color:var(--fg);flex:1 1 160px;min-width:0}
.acct input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.acct select{flex:1 1 160px}
.acct label{display:block;font-size:12px;color:var(--muted);margin-top:10px}
.acct .who{flex:1 1 auto;font-size:13px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
#syncState.ok{color:var(--ok)}
#syncState.err{color:var(--bad)}
/* ---------- sign-in gate ---------- */
#gate{display:none}
body.show-gate > header, body.show-gate > main, body.show-gate #report{display:none!important}
body.show-gate{background:#ffffff}
body.show-gate #gate{display:flex;min-height:100vh;align-items:center;justify-content:center;padding-block:24px}
.gate-card{width:100%;max-width:360px;background:#ffffff;padding:20px 8px 26px;position:relative;text-align:center}
.gate-card .lang{position:absolute;top:0;right:0}
.gate-card .lang button{padding:3px 10px;font-size:12px}
.dancer-hero{width:200px;height:213px;display:block;margin:8px auto 0}
.brand{font-family:var(--display);font-weight:700;font-size:30px;color:var(--accent);margin:2px 0 18px;justify-content:center}
.gate-step{display:grid;gap:12px}
.gate-step input{font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:999px;padding:12px 18px;background:#ffffff;color:var(--fg);width:100%;text-align:center}
.gate-step input::placeholder{color:#b9a3ae}
.gate-step input:focus-visible{outline:none;border-color:var(--accent);background:#fff}
#code{letter-spacing:.35em;font-variant-numeric:tabular-nums;font-size:20px}
button.wide{width:100%;padding:13px;font-size:17px;font-family:var(--display);font-weight:600}
.gate-hint{color:var(--muted);font-size:13px;margin:0}
.gate-links{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
button.link{border:0;background:none;color:var(--accent);padding:2px 0;font-size:13px;box-shadow:none}
button.link:disabled{color:var(--muted)}
.gate-msg{color:var(--bad);font-size:13px;margin:12px 0 0;min-height:1em}
.gate-msg.ok{color:var(--ok)}
.gate-dots{display:flex;gap:8px;justify-content:center;padding:10px}
.gate-dots i{width:9px;height:9px;border-radius:50%;background:var(--accent);opacity:.3;animation:dot 1.2s infinite}
.gate-dots i:nth-child(2){animation-delay:.2s}.gate-dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{40%{opacity:1;transform:translateY(-3px)}}
.d-bob{animation:bob 3s ease-in-out infinite;transform-origin:120px 240px}
@keyframes bob{50%{transform:translateY(-4px) rotate(-1.5deg)}}
.d-tw{animation:twinkle 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.d-tw2{animation-delay:.8s}.d-tw3{animation-delay:1.6s}
@keyframes twinkle{50%{opacity:.35;transform:scale(.75)}}
@media (prefers-reduced-motion:reduce){.d-bob,.d-tw,.gate-dots i{animation:none}}
/* ---------- learn page ---------- */
#learn{display:none}
body.view-learn #learn{display:block}
body.view-learn > main{display:none}
body.view-learn > header > p{display:none}
body.show-gate #learn, body.show-report #learn{display:none!important}
/* ---------- diary ---------- */
#diary{display:none}
body.view-diary #diary{display:block}
body.view-diary > main{display:none}
body.view-diary > header > p{display:none}
body.show-gate #diary, body.show-report #diary{display:none!important}
.diary-wrap{max-width:1000px;margin:0 auto;display:grid;gap:16px}
.d-alert{background:#fff4f5;border:1.5px solid var(--bad);border-radius:18px;padding:12px 16px;color:var(--fg)}
.d-alert p{margin:4px 0}
.d-alert b{color:var(--bad)}
.d-form{display:grid;gap:10px}
.d-form h3{margin:6px 0 0;font-size:16px}
.d-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.d-row label{font-weight:700}
.d-row input[type=date]{font:inherit;border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--fg);background:var(--surface)}
.faces{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.faces button{border-radius:16px;padding:6px 2px;display:grid;justify-items:center;gap:2px;border:2px solid var(--line);background:var(--surface)}
.faces button svg{width:100%;max-width:46px;height:auto}
.faces button span{font-size:11px;line-height:1.2;color:var(--muted)}
.faces button[aria-pressed="true"]{background:var(--pc);border-color:var(--accent)}
.faces button[aria-pressed="true"] span{color:var(--fg);font-weight:700}
.dchips{display:flex;flex-wrap:wrap;gap:6px}
.chip-btn{border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.chip-btn[aria-pressed="true"],.chip-btn:has(input:checked){background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip-btn input{accent-color:var(--accent)}
#dNote{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:14px;padding:8px 12px;resize:vertical;color:var(--fg);background:var(--surface)}
.d-row2{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:1.5em}
.d-msg{margin:0;font-size:13px;color:var(--bad)}
.d-msg.ok{color:var(--ok)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:8px}
.cal-h{font-size:11px;color:var(--muted);text-align:center}
.cal-d{aspect-ratio:1;border-radius:10px;border:1px solid transparent;padding:0;font-size:12px;font-variant-numeric:tabular-nums;position:relative;color:var(--fg)}
.cal-d.empty{background:var(--surface);border:1px dashed var(--line);color:var(--muted)}
.cal-d.today{outline:2px solid var(--accent);outline-offset:1px}
.cal-d i{position:absolute;right:3px;top:1px;font-size:9px;font-style:normal}
.cal.big{max-width:560px}
.cal.big .cal-d{font-size:12px;aspect-ratio:auto;height:30px;border-radius:8px}
.cal-legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-bottom:8px}
.cal-legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-2px}
.ins{margin:0 0 12px;padding-left:18px;font-size:14px;display:grid;gap:4px}
.risk-item{border-left:4px solid var(--ph-demi);background:var(--tint);border-radius:0 12px 12px 0;padding:8px 12px;margin-bottom:8px}
.risk-item .cnt{color:var(--muted);font-size:13px;margin-left:8px}
.risk-item p{margin:4px 0 0;font-size:13px}
.tbl-wrap{overflow-x:auto}
.dtable{border-collapse:collapse;font-size:13px;width:100%}
.dtable th,.dtable td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.pdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
@media (max-width:420px){.faces{grid-template-columns:repeat(3,minmax(0,1fr))}}
header .tabs{display:flex;gap:4px;background:var(--tint);border-radius:999px;padding:4px;align-self:center}
header .tabs button{border:0;background:none;padding:6px 16px;font-weight:700;color:var(--muted)}
header .tabs button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 4px rgba(74,42,58,.12)}
.learn-wrap{max-width:1000px;margin:0 auto;display:grid;gap:16px}
.learn-intro h2{font-size:24px;margin:0 0 4px;color:var(--accent);display:block}
.learn-intro p{margin:0;color:var(--muted);max-width:60ch}
.dir-tabs{display:flex;gap:8px;flex-wrap:wrap}
.dir-tabs button{padding:8px 18px;font-weight:700}
.dir-tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.learn-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.learn-grid{grid-template-columns:1fr}}
.anim-card{position:relative}
.view-badge{position:absolute;left:14px;top:14px;font-size:12px;font-weight:700;color:var(--muted);background:var(--tint);border-radius:999px;padding:2px 10px}
.anim-stage svg{width:100%;max-width:400px;height:auto;display:block;margin:0 auto}
.phase-track{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.phase-track span{padding:4px 14px;border-radius:999px;font-size:13px;font-weight:700;background:var(--tint);color:var(--muted);transition:background .2s,color .2s}
.phase-track span.on{color:#fff;background:var(--c)}
.anim-caption{text-align:center;font-family:var(--display);font-size:19px;margin:10px 0 8px;min-height:1.5em}
.anim-ctl{display:flex;justify-content:center}
.learn-wrap h3{font-family:var(--display);font-weight:600;font-size:19px;margin:8px 0 0}
.card h3{margin:0 0 12px}
.tips-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.tips-list li{padding-left:30px;position:relative}
.tips-list li::before{content:"✓";position:absolute;left:0;top:1px;width:21px;height:21px;border-radius:50%;background:var(--ok);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:760px){.steps{grid-template-columns:repeat(5,150px);overflow-x:auto;padding-bottom:6px}}
.step{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;text-align:center}
.step svg{width:100%;height:auto;display:block}
.step .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:13px;margin-top:2px}
.step p{margin:6px 0 0;font-size:13px}
.mistakes{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:12px}
@media (max-width:760px){.mistakes{grid-template-columns:1fr}}
.mistake{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mistake figure{margin:0;text-align:center}
.mistake svg{width:100%;height:auto;display:block}
.mistake figcaption{font-size:14px;font-weight:700}
.mistake .bad{color:var(--bad)}
.mistake .good{color:var(--ok)}
.learn-cta{display:flex;justify-content:center;padding:8px 0 28px}
.learn-cta button{max-width:360px}
/* module switch and module-only blocks */
h1 .mods{display:inline-flex;gap:2px;background:var(--tint);border-radius:999px;padding:3px;font-family:var(--font);letter-spacing:0}
h1 .mods button{border:0;background:none;padding:3px 12px;font-size:13px;font-weight:700;color:var(--muted)}
h1 .mods button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
body[data-mod="plie"] [data-mod="tendu"], body[data-mod="tendu"] [data-mod="plie"]{display:none!important}
.exports{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.exports button{padding:4px 10px;font-size:12px}
.exports small{flex-basis:100%;color:var(--muted);font-size:12px}

/* ---------- report ---------- */
#report{display:none}
body.show-report > header, body.show-report > main{display:none}
body.show-report #report{display:block}
.rp-bar{max-width:880px;margin:0 auto 12px;display:flex;justify-content:space-between;gap:8px}
.rp{max-width:880px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 28px 20px}
.rp h1{font-family:var(--display);font-size:26px;margin:0 0 4px;color:var(--accent)}
.rp h2{font-size:17px;margin:28px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--accent);display:block}
.rp .sub{color:var(--muted);font-size:13px;margin:0}
.rp-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .v small{font-size:13px;font-weight:400;color:var(--muted);margin-left:4px}
.focus{display:grid;gap:10px}
.focus .item{border-left:4px solid var(--bad);padding:6px 12px;background:var(--tint);border-radius:0 8px 8px 0}
.focus .item b{font-size:15px}
.focus .item .cnt{color:var(--bad);font-size:13px;margin-left:8px;font-variant-numeric:tabular-nums}
.focus .item p{margin:4px 0 0;font-size:13px}
.good-msg{background:var(--tint);border-radius:8px;padding:10px 12px;color:var(--ok);font-weight:600}
.rates{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr) 7.5em;gap:6px 10px;align-items:center;font-size:13px}
.rates .bar{height:10px;background:var(--tint);border-radius:4px;overflow:hidden}
.rates .bar span{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.rates .pct{font-variant-numeric:tabular-nums;text-align:right}
.rates .pct.low{color:var(--bad);font-weight:600}
.trend svg{width:100%;height:auto;display:block}
.trend .cap{font-size:13px;font-weight:600;margin:0 0 4px}
.heat-wrap{overflow-x:auto;margin-top:16px}
.heat{border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.heat th,.heat td{padding:4px 8px;text-align:center;border:2px solid var(--surface)}
.heat th:first-child,.heat td:first-child{text-align:left;white-space:nowrap}
.heat th{color:var(--muted);font-weight:400}
.rp-rep{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;break-inside:avoid}
.rp-rep .hd{display:flex;justify-content:space-between;gap:8px;font-weight:600;margin-bottom:8px;flex-wrap:wrap}
.rp-rep .hd .ok{color:var(--ok)}
.rp-rep .hd .bad{color:var(--bad)}
.snaps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}
.snaps figure{margin:0}
.snaps img{width:100%;border-radius:6px;display:block;background:#000}
.snaps figcaption{font-size:11px;color:var(--muted);text-align:center;margin-top:2px}
.rp-rep ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.rp-rep ul .v{color:var(--bad);margin-left:6px}
.rp-rep .pass{font-size:13px;color:var(--ok);margin-top:6px}
.rp-foot{margin-top:24px;font-size:11px;color:var(--muted);text-align:center}
.note-sm{font-size:12px;color:var(--muted)}
@media print{
  :root{--bg:#fff;--tint:#faf6f8;--surface:#fff;--fg:#4a2a3a;--muted:#8a6577;--line:#efe4e9;--accent:#cf3577;--ok:#239063;--bad:#dc3550;
        --ph-flat:#7aa7e0;--ph-demi:#f2b33d;--ph-point:#b05ad6;--ph-off:#dc3550;color-scheme:light}
  @page{size:A4;margin:12mm}
  body{background:#fff;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .no-print{display:none!important}
  .rp{border:0;padding:0;max-width:none}
  .rp h2{break-after:avoid}
}
</style>

<section id="gate">

<main>

          <input type="range" id="kneeMin" min="150" max="178" step="1" value="165"></div>

        <div class="slider"><label for="model" data-i="modelLabel"></label><span></span>

        <div class="slider"><label><input type="checkbox" id="voice" checked> <span data-i="voiceLabel"></span></label></div>

// ---------- model ----------
async function ensureModel(){
  const want = $("model").value;
  if (landmarker && loadedModel === want) return;
  setStatus("loading");
  const { PoseLandmarker, FilesetResolver } = await import(VISION);
  const fs = await FilesetResolver.forVisionTasks(WASM);
  const opts = d => ({ baseOptions:{ modelAssetPath: MODELS[want], delegate:d }, runningMode:"VIDEO", numPoses:1,
                      minPoseDetectionConfidence:0.5, minTrackingConfidence:0.5 });
  try { landmarker = await PoseLandmarker.createFromOptions(fs, opts("GPU")); }
  catch { landmarker = await PoseLandmarker.createFromOptions(fs, opts("CPU")); }
  loadedModel = want;
}

// ---------- sources ----------
async function startCamera(){
  stop();
  try {
    await ensureModel();
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:$("facing").value, width:{ideal:1280}, height:{ideal:720} }, audio:false });
  } catch(e){
    if (e && e.name === "NotAllowedError") setStatus("camDenied"); else setStatus("camFail", e.message || String(e));
    return;
  }
  video.srcObject = stream; video.loop = false;
  stage.classList.toggle("mirror", $("facing").value === "user");
  await video.play();
  mode = "cam"; begin();
}
async function startFile(file){
  stop();
  try { await ensureModel(); } catch(e){ setStatus("modelFail", e.message || String(e)); return; }
  video.srcObject = null; video.src = URL.createObjectURL(file); video.loop = true;
  stage.classList.remove("mirror");
  await video.play(); video.playbackRate = +$("speed").value;
  mode = "file"; begin();
}
function begin(){
  $("placeholder").hidden = true; $("chips").hidden = false; $("stopBtn").disabled = false;
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  stage.style.aspectRatio = `${video.videoWidth} / ${video.videoHeight}`;
  setStatus(mode === "cam" ? "camOn" : "fileOn");
  srcId++;
  running = true; lastVideoTime = -1; resetTracking(); updateRecUI(); loop();
}
function stop(){
  stopRec();
  running = false; cancelAnimationFrame(rafId); updateRecUI();
  if (stream){ stream.getTracks().forEach(tr => tr.stop()); stream = null; }
  video.pause(); $("stopBtn").disabled = true;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  $("frameGuide").hidden = true; frameShown = null;
}
$("camBtn").addEventListener("click", startCamera);
$("fileInput").addEventListener("change", e => { const f = e.target.files[0]; if (f) startFile(f); e.target.value = ""; });
$("stopBtn").addEventListener("click", () => { stop(); setStatus("stopped"); });

function loop(){
  if (!running) return;
  if (video.readyState >= 2 && video.currentTime !== lastVideoTime){
    lastVideoTime = video.currentTime;
    if (canvas.width !== video.videoWidth){ canvas.width = video.videoWidth; canvas.height = video.videoHeight; }
    const res = landmarker.detectForVideo(video, performance.now());
    analyze(res.landmarks && res.landmarks[0], res.worldLandmarks && res.worldLandmarks[0]);
    if (recorder && recAnnotated) drawComposite();
  }
  rafId = requestAnimationFrame(loop);
}

// ---------- recording ----------
// "with overlay" records a canvas that combines the video, the skeleton/trail and the labels;
// "raw" records the camera stream directly (better for analyzing again later).
// Frames are stored unmirrored so left/right stay correct when a recording is analyzed again.
const comp = document.createElement("canvas"), cctx = comp.getContext("2d");
let recorder = null, recAnnotated = true, recStartAt = 0, recTimer = 0, recordings = [], phaseColor = "#888";
function pickMime(){
  const c = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
  return c.find(m => MediaRecorder.isTypeSupported(m)) || "";
}
function startRec(){
  if (!window.MediaRecorder){ setStatus("recUnsupported"); return; }
  recAnnotated = $("recMode").value === "annotated" || mode === "file";
  if (mode === "file" && $("recMode").value === "raw") setStatus("recRawOnlyCam");
  let src;
  if (recAnnotated){ comp.width = video.videoWidth; comp.height = video.videoHeight; drawComposite(); src = comp.captureStream(30); }
  else src = stream;
  const mime = pickMime();
  let r;
  try { r = new MediaRecorder(src, mime ? { mimeType: mime, videoBitsPerSecond: 5e6 } : undefined); }
  catch(e){ setStatus("recFail", e.message || String(e)); return; }
  const chunks = [], annotated = recAnnotated, started = performance.now();
  r.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  r.onstop = () => {
    const type = (r.mimeType || mime || "video/webm").split(";")[0];
    const blob = new Blob(chunks, { type });
    if (blob.size){ addRecording(blob, (performance.now() - started) / 1000, annotated); setStatus("recDone"); }
  };
  r.start(1000);
  recorder = r; recStartAt = started;
  clearInterval(recTimer); recTimer = setInterval(updateRecUI, 500);
  updateRecUI();
}
function stopRec(){
  if (recorder && recorder.state !== "inactive") recorder.stop();
  recorder = null; clearInterval(recTimer); updateRecUI();
}
$("recBtn").addEventListener("click", () => recorder ? stopRec() : startRec());

const mmss = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");
function updateRecUI(){
  const b = $("recBtn");
  b.textContent = t(recorder ? "recStop" : "recStart");
  b.classList.toggle("on", !!recorder);
  b.disabled = !running && !recorder;
  $("recMode").disabled = !!recorder;
  $("recChip").hidden = !recorder;
  if (recorder) $("recChip").querySelector("span").textContent = "REC " + mmss((performance.now() - recStartAt) / 1000);
}

function drawComposite(){
  const w = comp.width, h = comp.height;
  if (!w || !h) return;
  cctx.drawImage(video, 0, 0, w, h);
  cctx.drawImage(canvas, 0, 0, w, h);
  const fs = Math.max(16, Math.round(h / 24)), pad = Math.round(fs * 0.45);
  cctx.font = `600 ${fs}px "PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif`;
  cctx.textBaseline = "middle";
  const chip = $("phaseChip");
  const rows = [
    { text: chip.querySelector("span").textContent + "  " + chip.querySelector("small").textContent, dot: phaseColor },
    { text: $("dirChip").querySelector("span").textContent },
  ];
  if (lastRep && !rep){
    const bad = REP.filter(k => lastRep.R[k][0] === "bad");
    rows.push({ text: bad.length ? "✗ " + bad.map(k => t("n_" + k)).join(t("sep")) : "✓ " + t("allCorrect"), dot: bad.length ? css("--bad") : css("--ok") });
  }
  let y = pad;
  for (const r of rows){
    const tw = cctx.measureText(r.text).width, dotW = r.dot ? fs * 0.9 : 0, bh = fs + pad;
    cctx.fillStyle = "rgba(0,0,0,.6)";
    cctx.fillRect(pad, y, tw + dotW + pad * 2, bh);
    if (r.dot){ cctx.fillStyle = r.dot; cctx.beginPath(); cctx.arc(pad * 2 + fs * 0.3, y + bh / 2, fs * 0.3, 0, Math.PI * 2); cctx.fill(); }
    cctx.fillStyle = "#fff"; cctx.fillText(r.text, pad * 2 + dotW, y + bh / 2);
    y += bh + pad / 2;
  }
}

function addRecording(blob, dur, annotated){
  const d = new Date();
  const p2 = n => String(n).padStart(2, "0");
  const stamp = `${d.getFullYear()}${p2(d.getMonth() + 1)}${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}`;
  const ext = blob.type.includes("mp4") ? "mp4" : "webm";
  recordings.unshift({ blob, url: URL.createObjectURL(blob), dur, annotated, when: `${p2(d.getHours())}:${p2(d.getMinutes())}`,
                       name: `tendu-${stamp}${annotated ? "-overlay" : ""}.${ext}`, saved: false });
  renderRecs();
}
function renderRecs(){
  const ul = $("recs"); ul.innerHTML = "";
  if (!recordings.length){ const li = document.createElement("li"); li.className = "empty"; li.textContent = t("recsEmpty"); ul.appendChild(li); return; }
  for (const r of recordings){
    const li = document.createElement("li");
    const info = document.createElement("div"); info.className = "info";
    info.textContent = `${r.when} · ${mmss(r.dur)} · ${(r.blob.size / 1048576).toFixed(1)} MB`;
    const sm = document.createElement("small");
    sm.textContent = t(r.annotated ? "tagAnnotated" : "tagRaw") + " · " + r.name.split(".").pop().toUpperCase() + (r.saved ? " · " + t("recSaved") : "");
    info.appendChild(sm);
    const mk = (key, fn) => { const b = document.createElement("button"); b.textContent = t(key); b.addEventListener("click", fn); return b; };
    li.append(info,
      mk("recAnalyze", () => startFile(r.blob)),
      mk("recSave", () => { const a = document.createElement("a"); a.href = r.url; a.download = r.name; document.body.appendChild(a); a.click(); a.remove(); r.saved = true; renderRecs(); }),
      mk("recDelete", () => { if (recorder) return; URL.revokeObjectURL(r.url); recordings = recordings.filter(x => x !== r); renderRecs(); }));
    ul.appendChild(li);
  }
}
window.addEventListener("beforeunload", e => {
  saveHistory();
  if (recorder || recordings.some(r => !r.saved) || cloud.queue.length){ e.preventDefault(); e.returnValue = t("leaveWarn"); }
});

// ---------- geometry ----------
const W = () => canvas.width, H = () => canvas.height;
const pt = (lm, i) => ({ x: lm[i].x * W(), y: lm[i].y * H(), v: lm[i].visibility ?? 1 });
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function angle(a, b, c){
  const v1x = a.x-b.x, v1y = a.y-b.y, v2x = c.x-b.x, v2y = c.y-b.y;
  const d = (v1x*v2x + v1y*v2y) / (Math.hypot(v1x,v1y) * Math.hypot(v2x,v2y) || 1);
  return Math.acos(Math.max(-1, Math.min(1, d))) * 180 / Math.PI;
}
function segDist(p, a, b){
  const dx = b.x - a.x, dy = b.y - a.y, len2 = dx*dx + dy*dy;
  const u = len2 ? Math.max(0, Math.min(1, ((p.x-a.x)*dx + (p.y-a.y)*dy) / len2)) : 0;
  return Math.hypot(p.x - (a.x + u*dx), p.y - (a.y + u*dy));
}
// how far the leg (hip -> ankle) leans away from vertical, in degrees
const legLean = (hip, ankle) => Math.abs(Math.atan2(ankle.x - hip.x, ankle.y - hip.y)) * 180 / Math.PI;
const ema = {};
const smooth = (k, v, a = 0.45) => (ema[k] = ema[k] == null ? v : ema[k] * (1 - a) + v * a);
const pct = e => Math.round(e * 100) + "%";
// Joint angle at b (a–b–c). With "3D angles" on, MediaPipe's world landmarks (metres) are used, so the angle
// doesn't change when the camera sees the leg at a slant; otherwise the on-screen 2D points are used.
function jointAngle(lm, wlm, a, b, c){
  if (cfg.angle3d && wlm){
    const A = wlm[a], B = wlm[b], C = wlm[c];
    const v1 = [A.x - B.x, A.y - B.y, A.z - B.z], v2 = [C.x - B.x, C.y - B.y, C.z - B.z];
    const d = (v1[0]*v2[0] + v1[1]*v2[1] + v1[2]*v2[2]) / (Math.hypot(...v1) * Math.hypot(...v2) || 1);
    return Math.acos(Math.max(-1, Math.min(1, d))) * 180 / Math.PI;
  }
  return angle(pt(lm, a), pt(lm, b), pt(lm, c));
}

// ---------- per-frame analysis ----------
let workSide = "right", view = "front", facing = 0, lastLeg = null, lastRep = null, lastDir;
const VIS = 0.5;
function analyze(lm, wlm){ checkFraming(lm); return mod === "plie" ? analyzePlie(lm, wlm) : analyzeTendu(lm, wlm); }

// ---------- framing assistant (camera only) ----------
// Checks every frame where the dancer is in the picture; a hint shows only after the same problem has
// lasted ~0.8 s and clears after ~0.5 s of good framing, so it doesn't flicker.
let frameIssue = null, frameSince = 0, frameShown = null, frameOkSince = 0;
function framingProblem(lm){
  if (!lm) return "fgNobody";
  const vis = i => (lm[i].visibility ?? 1) >= 0.35;
  const inFrame = i => vis(i) && lm[i].y <= 0.985 && lm[i].y >= 0.01 && lm[i].x >= 0.01 && lm[i].x <= 0.99;
  const feet = [27, 28, 29, 30, 31, 32];
  if (feet.filter(inFrame).length < 4) return "fgFeet";
  if (!inFrame(0)) return "fgHead";
  const top = lm[0].y, bottom = Math.max(...feet.map(i => lm[i].y));
  if (bottom - top < 0.4) return "fgSmall";
  const cx = (lm[23].x + lm[24].x) / 2;
  if (cx < 0.15 || cx > 0.85) return "fgCenter";
  if (mod === "plie" && view === "side") return "fgPlieFront";
  if (mod === "tendu"){
    if ((cfg.dir === "devant" || cfg.dir === "derriere") && view === "front") return "fgTenduSide";
    if (cfg.dir === "seconde" && view === "side") return "fgTenduFront";
  }
  return null;
}
function checkFraming(lm){
  const box = $("frameGuide");
  if (mode !== "cam"){ if (!box.hidden) box.hidden = true; frameShown = null; return; }
  const now = performance.now(), issue = framingProblem(lm);
  if (issue !== frameIssue){ frameIssue = issue; frameSince = now; }
  if (issue && now - frameSince > 800 && frameShown !== issue){
    frameShown = issue; box.innerHTML = `${esc(t(issue))}<small>${esc(t(issue + "Hint"))}</small>`; box.hidden = false;
  } else if (!issue && frameShown && now - frameSince > 500){ frameShown = null; box.hidden = true; }
}
function analyzeTendu(lm, wlm){
  ctx.clearRect(0, 0, W(), H());
  if (!lm){ LIVE.forEach(k => setRow(liveEls, k, ["na", "noPerson"])); setPhaseChip(null); return; }

  const L = {}, R = {};
  for (const k of ["hip","knee","ankle","heel","toe"]){ L[k] = pt(lm, LEGS.left[k]); R[k] = pt(lm, LEGS.right[k]); }
  const leanL = smooth("leanL", legLean(L.hip, L.ankle)), leanR = smooth("leanR", legLean(R.hip, R.ankle));

  // camera view (front vs side) and which way she faces (side view)
  const ls = pt(lm, 11), rs = pt(lm, 12);
  const shMid = { x:(ls.x+rs.x)/2, y:(ls.y+rs.y)/2 }, hipMid = { x:(L.hip.x+R.hip.x)/2, y:(L.hip.y+R.hip.y)/2 };
  const torso = dist(shMid, hipMid) || 1;
  view = smooth("shw", dist(ls, rs) / torso) > 0.45 ? "front" : "side";
  const nose = pt(lm, 0), earX = (lm[7].x + lm[8].x) / 2 * W();
  const f = smooth("facing", nose.x - earX);
  facing = Math.abs(f) < 0.02 * torso ? 0 : Math.sign(f);

  // which leg is working
  if (cfg.leg !== "auto") workSide = cfg.leg;
  else if (Math.max(leanL, leanR) > 9 && Math.abs(leanL - leanR) > 5) workSide = leanL > leanR ? "left" : "right";
  const work = workSide === "left" ? L : R, sup = workSide === "left" ? R : L;
  const workLean = workSide === "left" ? leanL : leanR;
  lastLeg = workSide;
  setText($("legInfo"), t("legInfo", t(workSide), cfg.leg === "auto"));

  const legLen = dist(sup.hip, sup.ankle) || 1;
  const footRef = 0.27 * legLen;               // a foot is roughly 27% of hip-to-ankle length
  const extended = workLean > 12;
  const out = {};

  // knees
  const otherSide = workSide === "left" ? "right" : "left";
  for (const [key, leg, idx] of [["workKnee", work, LEGS[workSide]], ["supportKnee", sup, LEGS[otherSide]]]){
    if (Math.min(leg.hip.v, leg.knee.v, leg.ankle.v) < VIS){ out[key] = ["na", "unclear"]; continue; }
    const a = smooth(key, jointAngle(lm, wlm, idx.hip, idx.knee, idx.ankle));
    out[key] = [a >= cfg.kneeMin ? "ok" : "bad", "deg", Math.round(a) + "°"];
  }
  // hips level (front view only)
  if (view !== "front" || Math.min(L.hip.v, R.hip.v) < VIS) out.hips = ["na", "needFront"];
  else {
    const tilt = smooth("hips", Math.abs(Math.atan2(L.hip.y - R.hip.y, Math.abs(L.hip.x - R.hip.x))) * 180 / Math.PI);
    out.hips = [tilt <= cfg.hipMax ? "ok" : "bad", "deg", tilt.toFixed(1) + "°"];
  }

  // foot phase: from heel height and toe height above the floor (floor = standing foot)
  let ph = null, heelH = null, toeLift = null;
  if (Math.min(work.toe.v, work.heel.v, sup.toe.v, sup.heel.v) >= VIS){
    const floorY = Math.max(sup.toe.y, sup.heel.y);
    heelH = smooth("heelH", (floorY - work.heel.y) / footRef);
    toeLift = smooth("toeLift", (floorY - work.toe.y) / legLen);
    ph = toeLift > cfg.toeMax ? -1 : heelH >= cfg.pointH ? 2 : heelH >= cfg.demiH ? 1 : 0;
  }
  if (!(extended || rep)) out.toe = ["na", "whenOut"];
  else if (ph === null) out.toe = ["na", "footUnclear"];
  else out.toe = ph === -1 ? ["bad", "lifted", pct(toeLift)] : ["ok", "onFloor"];
  setPhaseChip(ph, heelH == null ? "" : t("heel", heelH.toFixed(2)));

  // instep: knee–ankle–toe angle of the working foot (≈180° when the foot is fully stretched)
  const wi = LEGS[workSide];
  const ankA = Math.min(work.knee.v, work.ankle.v, work.toe.v) >= VIS ? smooth("ankA", jointAngle(lm, wlm, wi.knee, wi.ankle, wi.toe)) : null;
  // standing-knee hyperextension (side view): the knee sits BEHIND the hip–ankle line instead of on or in front of it
  let hyper = null;
  if (view === "side" && facing && Math.min(sup.hip.v, sup.knee.v, sup.ankle.v) >= VIS && Math.abs(sup.ankle.y - sup.hip.y) > 1){
    const lineX = sup.hip.x + (sup.ankle.x - sup.hip.x) * (sup.knee.y - sup.hip.y) / (sup.ankle.y - sup.hip.y);
    const bendS = 180 - angle(sup.hip, sup.knee, sup.ankle);
    hyper = smooth("hyper", (sup.knee.x - lineX) * facing < 0 ? bendS : -bendS);
  }
  trackRep({ t: video.currentTime, lean: workLean, ph, ankA, hyper, toe: { x: work.toe.x, y: work.toe.y }, toeVis: work.toe.v }, out, work, sup, legLen, footRef);

  for (const k of LIVE) setRow(liveEls, k, out[k]);
  draw(lm, work, sup, out);
  afterDraw();
  recordFrame(lm, wlm, ph, workLean, heelH);
  voice(out);
}

function setPhaseChip(ph, extra){
  const chip = $("phaseChip");
  if (ph === null){ if (chip._ph !== null){ chip._ph = null; chip.style.setProperty("--c", "#888"); } setText(chip.querySelector("span"), t("chipUnknown")); setText(chip.querySelector("small"), ""); return; }
  const [key, tok] = PHASES[ph];
  if (chip._ph !== ph){ chip._ph = ph; chip.style.setProperty("--c", `var(${tok})`); }
  phaseColor = css(tok);
  setText(chip.querySelector("span"), t(key));
  setText(chip.querySelector("small"), extra || "");
}

// ---------- drawing ----------
// colour tokens never change at runtime (single light theme), so read each one once
const cssCache = {};
const css = n => cssCache[n] ?? (cssCache[n] = getComputedStyle(document.documentElement).getPropertyValue(n).trim());
function draw(lm, work, sup, out){
  const col = s => s === "ok" ? css("--ok") : s === "bad" ? css("--bad") : "rgba(255,255,255,.75)";
  const lw = Math.max(3, W() / 220);
  const seg = (a, b, c) => { if (a.v < 0.3 || b.v < 0.3) return; ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); };
  const P = i => pt(lm, i), neutral = "rgba(255,255,255,.55)";
  ctx.lineCap = "round"; ctx.lineJoin = "round";

  // toe trail, coloured by foot phase
  if (!rep && trail.length && performance.now() - trailEnd > 5000) trail = [];
  if (trail.length > 1){
    ctx.lineWidth = lw * 1.1;
    for (let i = 1; i < trail.length; i++){
      ctx.strokeStyle = trail[i].ph === null ? neutral : css(PHASES[trail[i].ph][1]);
      ctx.beginPath(); ctx.moveTo(trail[i-1].x, trail[i-1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke();
    }
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(trail[0].x, trail[0].y, lw * 1.4, 0, Math.PI * 2); ctx.fill();
  }

  [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24]].forEach(([a,b]) => seg(P(a), P(b), neutral));
  seg(P(23), P(24), col(out.hips[0]));
  seg(work.hip, work.knee, col(out.workKnee[0])); seg(work.knee, work.ankle, col(out.workKnee[0]));
  seg(sup.hip, sup.knee, col(out.supportKnee[0])); seg(sup.knee, sup.ankle, col(out.supportKnee[0]));
  const footCol = out.toe[0] === "bad" ? css("--bad") : "rgba(255,255,255,.9)";
  seg(work.ankle, work.heel, footCol); seg(work.ankle, work.toe, footCol); seg(work.heel, work.toe, footCol);
  seg(sup.ankle, sup.heel, neutral); seg(sup.ankle, sup.toe, neutral); seg(sup.heel, sup.toe, neutral);
  for (const p of [work.hip, work.knee, work.ankle, work.heel, work.toe, sup.hip, sup.knee, sup.ankle]){
    if (p.v < 0.3) continue; ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(p.x, p.y, lw * 1.1, 0, Math.PI * 2); ctx.fill();
  }
}

// ---------- rep tracking ----------
// A rep starts when the working leg leans > 7° and counts once it passes 12°.
// The last 3 s of frames are buffered so the start of the slide (flat-foot phase) is kept:
// the rep is back-dated to the last moment the leg was still at rest.
// Progress is measured by the toe's distance from where it started (not the leg angle,
// which returns to vertical while a flat foot is still out). The rep ends when the toe
// is back home or stops on the way back, or if it goes out again without closing.
// Timing uses the video's own clock, so slow-motion playback behaves the same.
let rep = null, reps = [], trail = [], trailEnd = 0, buf = [];
function resetTracking(){ rep = null; buf = []; trail = []; }
function trackRep(s, out, work, sup, legLen, footRef){
  if (buf.length && s.t < buf[buf.length - 1].t) resetTracking();          // video looped
  buf.push(s);
  while (buf.length && s.t - buf[0].t > 3.0) buf.shift();

  if (!rep){
    if (s.lean <= 7) return;
    const minLean = Math.min(...buf.map(b => b.lean));
    let k = 0; buf.forEach((b, i) => { if (b.lean <= minLean + 1) k = i; });
    rep = { start: buf[k].t, side: workSide, max: s.lean, phase: "out", errors: new Set(), S: buf.slice(k), s0: buf[k].toe, maxD: 0,
            seen: new Set(), needStart: true, farDirty: false, hasFar: false };
    trail = rep.S.filter(b => b.toeVis >= 0.3).map(b => ({ x: b.toe.x, y: b.toe.y, ph: b.ph }));
  } else {
    rep.S.push(s);
    if (s.toeVis >= 0.3) trail.push({ x: s.toe.x, y: s.toe.y, ph: s.ph });
  }
  rep.max = Math.max(rep.max, s.lean);
  const d = dist(s.toe, rep.s0) / legLen;
  if (d >= rep.maxD) rep.farDirty = true;                 // new farthest point: keep this frame
  rep.maxD = Math.max(rep.maxD, d);
  for (const k of LIVE) if (out[k][0] !== "na") rep.seen.add(k);
  const recent = rep.S.filter(b => s.t - b.t <= 0.3);
  const stable = recent.length >= 3 && recent.every(b => dist(b.toe, s.toe) < 0.02 * legLen);
  if (rep.max > 12) for (const k of LIVE) if (k !== "toe" && out[k][0] === "bad") rep.errors.add(k);

  if (rep.phase === "out"){
    if (rep.max <= 12 && s.lean < 5){ rep = null; trail = []; return; }    // just a wobble
    if (rep.max > 12 && d < rep.maxD * 0.6) rep.phase = "back";
  } else if (d > rep.maxD * 0.75) finishRep(work, sup, legLen, footRef, false);        // went out again
  else if (d < rep.maxD * 0.1 || (stable && d < rep.maxD * 0.5)) finishRep(work, sup, legLen, footRef, true);
}

function detectDirection(D){
  if (cfg.dir !== "auto") return { dir: cfg.dir, note: null };
  const len = Math.hypot(D.x, D.y) || 1;
  if (view === "front"){
    if (Math.abs(D.x) >= 0.6 * len) return { dir: "seconde", note: null };
    return { dir: D.y > 0 ? "devant" : "derriere", note: ["frontAmbig"] };
  }
  if (!facing) return { dir: null, note: ["noFacing"] };
  return { dir: D.x * facing > 0 ? "devant" : "derriere", note: null };
}

function judgeRep(S, closedNormally, work, sup, legLen, footRef){
  const R = {};
  const V = S.filter(s => s.ph !== null && s.toeVis >= 0.3);
  if (V.length < 8){ REP.forEach(k => R[k] = ["na", "footUnclear"]); return { R, dir: null, note: ["repUnclear"], V: null, mi: 0 }; }
  const s0 = V[0].toe;
  let mi = 0;
  V.forEach((s, i) => { s.d = dist(s.toe, s0); if (s.d > V[mi].d) mi = i; });
  const maxD = V[mi].d || 1;
  V.forEach(s => s.e = s.d / maxD);
  const O = V.slice(0, mi + 1), B = V.slice(mi);
  // share of frames in phase p, ignoring toe-off frames (those are reported by the floor check)
  const frac = (arr, p) => { const a = arr.filter(s => s.ph !== -1); return a.length ? a.filter(s => s.ph === p).length / a.length : 0; };
  const idx = (arr, p) => arr.findIndex(s => s.ph === p);
  let { dir, note } = detectDirection({ x: V[mi].toe.x - s0.x, y: V[mi].toe.y - s0.y });

  // toe stays on the floor
  const offO = O.some(s => s.ph === -1), offB = B.some(s => s.ph === -1);
  R.floor = offO || offB ? ["bad", offO && offB ? "offBoth" : offO ? "offOut" : "offBack"] : ["ok", "allOn"];

  // path: deviation from straight lines start -> farthest -> end
  const e = V[V.length - 1].toe, fp = V[mi].toe;
  let dev = 0;
  V.forEach((s, i) => { dev = Math.max(dev, i <= mi ? segDist(s.toe, s0, fp) : segDist(s.toe, fp, e)); });
  dev /= legLen;
  R.path = [dev <= cfg.pathMax ? "ok" : "bad", "dev", pct(dev)];

  // out: flat -> demi -> point
  const oD = frac(O, 1), oDi = idx(O, 1), oPi = idx(O, 2);
  if (oD === 0) R.outDemi = ["bad", "noDemi"];
  else if (oPi >= 0 && oPi < oDi) R.outDemi = ["bad", "reversed"];
  else if (oD < cfg.demiMin) R.outDemi = ["bad", "shortDemi", pct(oD)];
  else R.outDemi = ["ok", "demiShare", pct(oD)];

  // when the heel leaves the floor on the way out
  const firstLift = O.find(s => s.ph >= 1 || s.ph === -1);
  if (!firstLift) R.lift = ["bad", "neverLift"];
  else if (firstLift.e < cfg.liftMin) R.lift = ["bad", "liftEarly", pct(firstLift.e)];
  else if (firstLift.e > cfg.liftMax) R.lift = ["bad", "liftLate", pct(firstLift.e)];
  else R.lift = ["ok", "liftOk", pct(firstLift.e)];

  // fully pointed at the far end
  const far = V.filter(s => s.e >= 0.9);
  // pointed = heel high enough AND the instep stretched (median knee–ankle–toe angle at the far end)
  const angs = far.map(s => s.ankA).filter(a => a != null).sort((a, b) => a - b);
  const ankMed = angs.length ? angs[Math.floor(angs.length / 2)] : null;
  if (frac(far, 2) < 0.5) R.point = ["bad", frac(far, 1) >= frac(far, 0) ? "onlyDemi" : "heelNotUp"];
  else if (ankMed != null && ankMed < cfg.pointAngle) R.point = ["bad", "instepBent", Math.round(ankMed)];
  else R.point = ["ok", ankMed != null ? "pointedDeg" : "pointed", ankMed != null ? Math.round(ankMed) : undefined];

  // back: point -> demi -> flat
  const bD = frac(B, 1), bDi = idx(B, 1), bFi = idx(B, 0);
  if (bD === 0) R.backDemi = ["bad", "noDemi"];
  else if (bFi >= 0 && bFi < bDi) R.backDemi = ["bad", "badOrder"];
  else if (bD < cfg.demiMin) R.backDemi = ["bad", "shortDemi", pct(bD)];
  else R.backDemi = ["ok", "demiShare", pct(bD)];

  // heel must land before the foot closes
  if (bFi < 0) R.heelDown = ["bad", "noHeelDown"];
  else if (B[bFi].e < cfg.heelDownMin) R.heelDown = ["bad", "heelLate", pct(B[bFi].e)];
  else R.heelDown = ["ok", "heelOk", pct(B[bFi].e)];

  // closing gap between the two feet
  if (!closedNormally) R.close = ["bad", "notClosed"];
  else if (Math.min(work.heel.v, work.toe.v, sup.heel.v, sup.toe.v) < 0.2) R.close = ["na", "footUnclear"];
  else {
    const gap = Math.min(
      segDist(work.heel, sup.heel, sup.toe), segDist(work.toe, sup.heel, sup.toe), segDist(work.ankle, sup.heel, sup.toe),
      segDist(sup.heel, work.heel, work.toe), segDist(sup.toe, work.heel, work.toe)) / footRef;
    R.close = gap < 0.1 ? ["ok", "snug"] : [gap <= cfg.closeMax ? "ok" : "bad", "gap", gap.toFixed(1)];
  }

  // standing knee pushed back (median over the tendu, so a single noisy frame doesn't count)
  const hv = V.filter(s => s.hyper != null).map(s => s.hyper).sort((a, b) => a - b);
  if (!hv.length) R.hyperext = ["na", "needSide"];
  else { const med = hv[Math.floor(hv.length / 2)]; R.hyperext = med > cfg.hyperMax ? ["bad", "hyperBad", Math.round(med)] : ["ok", "hyperOk"]; }

  // filming advice for this direction
  if (!note && dir === "seconde" && view === "side") note = ["secondeSide"];
  if (!note && dir && dir !== "seconde" && view === "front") note = ["sideFor", DIRS[dir]];
  return { R, dir, note, V, mi };
}

function finishRep(work, sup, legLen, footRef, closedNormally){
  const r = rep; rep = null; trailEnd = performance.now();
  if (video.currentTime - r.start < 0.35) return;
  const res = judgeRep(r.S, closedNormally, work, sup, legLen, footRef);
  for (const k of REP) if (res.R[k][0] === "bad") r.errors.add(k);
  const segs = res.V ? compressSegs(res.V) : null;
  const peak = res.V ? res.mi / Math.max(1, res.V.length - 1) : 0;
  const measured = [...r.seen].filter(k => k !== "toe").concat(REP.filter(k => res.R[k][0] !== "na"));
  const rec = { module: "tendu", n: reps.length + 1, side: r.side, dir: res.dir, errors: [...r.errors], R: res.R, segs, peak, measured,
                at: Date.now(), t0: r.start, t1: video.currentTime,
                snaps: { start: r.snapStart || null, far: r.hasFar ? farC.toDataURL("image/jpeg", 0.72) : null, close: null } };
  reps.push(rec);
  if (!sessionStart) sessionStart = rec.at;
  pendingClose = rec;                                      // closing frame is captured after this frame is drawn
  labelFrames(r.start, video.currentTime, rec.n);
  rec.id = uuid(); rec.sessionKey = sessionId; rec.sessionStart = sessionStart;
  rec.coords = repCoords(rec.n);
  if (reps.length === 1) sessionDancer = cloud.dancerId;
  enqueueRep(rec);
  lastRep = { ...res, side: r.side, segs, peak };
  lastDir = res.dir;
  showRep(lastRep);
  renderReps();
  $("dirChip").querySelector("span").textContent = dirLabel(res.dir);
  const firstBad = REP.find(k => res.R[k][0] === "bad");
  announceResult(!rec.errors.length, firstBad ? "c_" + firstBad : null);
}

// consecutive frames in the same phase -> [{ph, w}] with w = share of the rep
function compressSegs(V){
  const segs = [];
  V.forEach(s => { const last = segs[segs.length - 1]; if (last && last.ph === s.ph) last.n++; else segs.push({ ph: s.ph, n: 1 }); });
  return segs.map(sg => ({ ph: sg.ph, w: sg.n / V.length }));
}
function fillTimeline(tl, segs, peak){
  tl.innerHTML = "";
  if (!segs) return;
  for (const sg of segs){
    const el = document.createElement("span");
    el.style.width = (sg.w * 100) + "%";
    el.style.background = `var(${PHASES[sg.ph][1]})`;
    el.title = t(PHASES[sg.ph][0]);
    tl.appendChild(el);
  }
  const p = document.createElement("i"); p.className = "peak"; p.style.left = (peak * 100) + "%";
  tl.appendChild(p);
}
function showRep({ R, dir, note, segs, peak, side }){
  $("repEmpty").hidden = true; $("repBody").hidden = false;
  $("repTitle").textContent = dirLabel(dir) + " · " + t(side);
  $("repNote").textContent = note ? t(note[0], note[1]) : "";
  $("repNote").hidden = !note;
  for (const k of REP) setRow(repEls, k, R[k]);
  fillTimeline($("timeline"), segs, peak);
}

function renderReps(){
  $("repCount").textContent = reps.length;
  $("goodCount").textContent = reps.filter(r => !r.errors.length).length;
  const ul = $("reps"); ul.innerHTML = "";
  if (!reps.length){ const li = document.createElement("li"); li.className = "empty"; li.style.background = "none"; li.textContent = t("noReps"); ul.appendChild(li); return; }
  reps.slice().reverse().slice(0, 40).forEach((r, i) => {
    const li = document.createElement("li");
    const head = document.createElement("span");
    head.textContent = t("repLine", reps.length - i, r.dir ? dirLabel(r.dir).replace("Tendu ", "") : "?", t(r.side));
    const body = document.createElement("span");

    else { body.className = "err"; body.textContent = r.errors.map(k => t("n_" + k)).join(t("sep")); }
    li.append(head, body); ul.appendChild(li);
  });
}
function newSession(){
  saveHistory(); cloudSummary();
  reps = []; trail = []; lastRep = null; frames = []; sessionId = uuid(); sessionStart = null; sessionDancer = null;

// ---------- keyframe snapshots (start / farthest / close of each tendu) ----------
const SNAP_W = 360;
const farC = document.createElement("canvas"), farCtx = farC.getContext("2d");
const tmpC = document.createElement("canvas"), tmpCtx = tmpC.getContext("2d");
let pendingClose = null;
function snapTo(c, cx){
  const w = SNAP_W, h = Math.round(w * H() / W()) || 200;
  if (c.width !== w || c.height !== h){ c.width = w; c.height = h; }
  cx.drawImage(video, 0, 0, w, h); cx.drawImage(canvas, 0, 0, w, h);
}
const snapURL = () => { snapTo(tmpC, tmpCtx); return tmpC.toDataURL("image/jpeg", 0.72); };
function afterDraw(){
  if (rep && rep.needStart){ rep.snapStart = snapURL(); rep.needStart = false; }
  if (rep && rep.farDirty){ snapTo(farC, farCtx); rep.farDirty = false; rep.hasFar = true; }
  if (pendingClose){ pendingClose.snaps.close = snapURL(); pendingClose = null; }
}

// ---------- per-frame coordinates ----------
const LM_NAMES = ["nose","left_eye_inner","left_eye","left_eye_outer","right_eye_inner","right_eye","right_eye_outer","left_ear","right_ear",
  "mouth_left","mouth_right","left_shoulder","right_shoulder","left_elbow","right_elbow","left_wrist","right_wrist","left_pinky","right_pinky",
  "left_index","right_index","left_thumb","right_thumb","left_hip","right_hip","left_knee","right_knee","left_ankle","right_ankle",
  "left_heel","right_heel","left_foot_index","right_foot_index"];
const PH_CODE = { "-1":"toe_off", "0":"flat", "1":"demi_pointe", "2":"point", "10":"standing", "11":"going_down", "12":"bottom", "13":"coming_up" };
const MAX_FRAMES = 60000;                                // about 30 minutes at 30 fps
let frames = [], srcId = 0, sessionId = uuid(), sessionStart = null, sessionDancer = null;
function recordFrame(lm, wlm, ph, lean, heelH){
  const img = new Float32Array(99), world = wlm ? new Float32Array(99) : null;
  for (let i = 0; i < 33; i++){
    img[i*3] = lm[i].x; img[i*3+1] = lm[i].y; img[i*3+2] = lm[i].visibility ?? 1;
    if (world){ world[i*3] = wlm[i].x; world[i*3+1] = wlm[i].y; world[i*3+2] = wlm[i].z; }
  }
  frames.push({ src: srcId, t: video.currentTime, wall: Date.now(), rep: 0, side: workSide, ph, lean, heelH,
                vw: video.videoWidth, vh: video.videoHeight, img, world });
  if (frames.length > MAX_FRAMES) frames.shift();
  if (frames.length % 30 === 0) updateFrameInfo();
}
// after a tendu is judged, tag its frames with the tendu number
function labelFrames(t0, t1, n){
  for (let i = frames.length - 1; i >= 0; i--){
    const f = frames[i];
    if (f.src !== srcId || f.t > t1 + 0.001) { if (f.src !== srcId) break; continue; }
    if (f.t < t0) break;
    f.rep = n;
  }
}
function updateFrameInfo(){
  const n = frames.length, secs = n ? Math.round((frames[n-1].wall - frames[0].wall) / 1000) : 0;
  $("frameInfo").textContent = n ? t("frameInfo", n, secs) : "";
}
function downloadText(name, text, type){
  const blob = new Blob(["﻿" + text], { type });            // BOM so Excel reads Chinese correctly
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
const stampNow = () => { const d = new Date(), p = n => String(n).padStart(2, "0"); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; };
const csvCell = v => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const num = (v, d = 5) => v == null || Number.isNaN(v) ? "" : (+v).toFixed(d);

$("exportFrames").addEventListener("click", () => {
  if (!frames.length){ setStatus("noFrames"); return; }
  const head = ["source","frame","time_s","wall_clock","tendu","working_leg","foot_phase","leg_lean_deg","heel_height_footlen","video_w","video_h"];
  for (const n of LM_NAMES) head.push(n + "_x", n + "_y", n + "_vis");
  for (const n of LM_NAMES) head.push(n + "_wx_m", n + "_wy_m", n + "_wz_m");
  const rows = [head.join(",")];
  frames.forEach((f, i) => {

               num(f.lean, 2), num(f.heelH, 3), f.vw, f.vh];
    for (let k = 0; k < 99; k++) r.push(num(f.img[k]));
    for (let k = 0; k < 99; k++) r.push(f.world ? num(f.world[k]) : "");
    rows.push(r.join(","));
  });

$("exportReps").addEventListener("click", () => {

    for (const k of keys){
      const st = r.errors.includes(k) ? "bad" : r.measured.includes(k) ? "ok" : "na";
      row.push(st, r.R[k] ? fmt(r.R[k])[1] : "");
    }
    rows.push(row.map(csvCell).join(","));
  }
  downloadText(`tendu-results-${stampNow()}.csv`, rows.join("\n"), "text/csv");
});

// ---------- history (long-term trend) ----------
const HKEY = "tendu-history";
function loadHistory(){ try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch { return []; } }
function sessionSummary(){
  const dirs = {}, fails = {}, meas = {};
  for (const r of reps){
    const k = r.dir || "unknown";
    dirs[k] = dirs[k] || [0, 0]; dirs[k][0]++; if (!r.errors.length) dirs[k][1]++;
    for (const e of r.errors) fails[e] = (fails[e] || 0) + 1;
    for (const m of r.measured) meas[m] = (meas[m] || 0) + 1;
  }
  return { id: sessionId, module: mod, start: sessionStart, end: reps.length ? reps[reps.length - 1].at : null,
           total: reps.length, good: reps.filter(r => !r.errors.length).length, dirs, fails, meas };
}
function saveHistory(){
  if (!reps.length) return;
  const h = loadHistory().filter(s => s.id !== sessionId);
  h.push(sessionSummary());
  h.sort((a, b) => a.start - b.start);
  try { localStorage.setItem(HKEY, JSON.stringify(h.slice(-200))); } catch {}
}

// ---------- report ----------
const locale = () => lang === "zh" ? "zh-CN" : "en-US";
const fTime = ts => new Date(ts).toLocaleTimeString(locale(), { hour: "2-digit", minute: "2-digit" });
const fDate = ts => new Date(ts).toLocaleDateString(locale(), { year: "numeric", month: "long", day: "numeric" });
const fShort = ts => new Date(ts).toLocaleDateString(locale(), { month: "numeric", day: "numeric" });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

// ctx = { reps, sid, start, hist, cloud }; without ctx the current session is reported
let reportCtx = null;
async function openReport(ctx){
  if (!ctx){
    if (!reps.length){ setStatus("noRepsForReport"); return; }
    saveHistory();
    const useCloud = cloudReady() && sessionDancer === cloud.dancerId;
    ctx = { reps, module: mod, sid: sessionId, start: sessionStart || reps[0].at, cloud: useCloud,
            hist: useCloud ? await cloudHistory() : loadHistory().filter(h => (h.module || "tendu") === mod) };
  }

function trendSVG(hs, sid){
  const Wd = 640, Ht = 220, L = 44, R = 24, T = 18, B = 34, iw = Wd - L - R, ih = Ht - T - B;
  const x = i => L + (hs.length === 1 ? iw / 2 : i * iw / (hs.length - 1));
  const y = v => T + (1 - v) * ih;
  let s = `<svg viewBox="0 0 ${Wd} ${Ht}" role="img" aria-label="${esc(t("trendChart"))}">`;
  for (const g of [0, 0.5, 1]){
    s += `<line x1="${L}" x2="${Wd - R}" y1="${y(g)}" y2="${y(g)}" style="stroke:var(--line)" stroke-width="1"/>`;
    s += `<text x="${L - 8}" y="${y(g) + 4}" text-anchor="end" font-size="11" style="fill:var(--muted)">${g * 100}%</text>`;
  }
  const rate = h => h.total ? h.good / h.total : 0;
  s += `<path d="${hs.map((h, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(rate(h)).toFixed(1)).join(" ")}" fill="none" style="stroke:var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const every = hs.length > 8 ? 2 : 1;
  hs.forEach((h, i) => {
    const cur = h.id === sid;
    s += `<circle cx="${x(i)}" cy="${y(rate(h))}" r="${cur ? 5 : 4}" style="fill:var(--accent);stroke:var(--surface)" stroke-width="2"><title>${esc(fDate(h.start))}: ${Math.round(rate(h) * 100)}% (${h.good}/${h.total})</title></circle>`;
    if (i % every === 0 || i === hs.length - 1)
      s += `<text x="${x(i)}" y="${Ht - 10}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${esc(cur ? t("thisSession") : fShort(h.start))}</text>`;
  });
  const li = hs.length - 1;
  s += `<text x="${x(li)}" y="${y(rate(hs[li])) - 10}" text-anchor="middle" font-size="12" font-weight="600" style="fill:var(--fg)">${Math.round(rate(hs[li]) * 100)}%</text>`;
  return s + "</svg>";
}

function renderReport(ctx = reportCtx){
  if (!ctx) return;
  const reps = ctx.reps, sessionId = ctx.sid, sessionStart = ctx.start;
  const n = reps.length, good = reps.filter(r => !r.errors.length).length;
  const P = v => Math.round(v * 100) + "%";
  const start = sessionStart || reps[0].at, end = reps[n - 1].at;
  const lc = reps.filter(r => r.side === "left").length;
  const dirName = dirLabel, M = ctx.module || "tendu";
  let h = `<div class="rp-bar no-print"><button id="rpBack">${esc(t("rpBack"))}</button><button class="primary" id="rpPrint">${esc(t("rpPrint"))}</button></div>`;
  h += `<article class="rp"><h1>${esc(t(M === "plie" ? "rpTitleP" : "rpTitle"))}</h1>`;
  h += `<p class="sub">${esc(fDate(start))} · ${esc(fTime(start))}–${esc(fTime(end))} · ${esc(t("minutes", Math.max(1, Math.round((end - start) / 60000))))} ${M === "plie" ? "" : "· " + esc(t("legsLine", lc, n - lc))}</p>`;

  // 1. summary
  h += `<h2>${esc(t("rpSummary"))}</h2><div class="rp-tiles">`;
  h += `<div class="tile"><div class="k">${esc(t("tTotal"))}</div><div class="v">${n}</div></div>`;
  h += `<div class="tile"><div class="k">${esc(t("tGood"))}</div><div class="v">${good}<small>${P(good / n)}</small></div></div>`;
  for (const d of MODS[M].dirs){
    const rs = reps.filter(r => r.dir === d);
    if (!rs.length) continue;
    const g = rs.filter(r => !r.errors.length).length;
    h += `<div class="tile"><div class="k">${esc(dirLabel(d))}</div><div class="v">${P(g / rs.length)}<small>${esc(t("dirTile", rs.length, g))}</small></div></div>`;
  }
  h += `</div>`;

  // 2. what to work on
  const stats = rateKeys(M).map(k => {
    const meas = reps.filter(r => r.measured.includes(k)).length;
    const fails = reps.filter(r => r.errors.includes(k)).length;
    return { k, meas, fails, rate: meas ? (meas - fails) / meas : null };
  });
  const top = stats.filter(s => s.fails > 0).sort((a, b) => b.fails / b.meas - a.fails / a.meas).slice(0, 3);
  h += `<h2>${esc(t("rpFocus"))}</h2>`;
  if (!top.length) h += `<div class="good-msg">✓ ${esc(t("rpAllGood"))}</div>`;
  else {
    h += `<div class="focus">`;
    for (const s of top) h += `<div class="item"><b>${esc(t("n_" + s.k))}</b><span class="cnt">${esc(t("failCount", s.fails, s.meas, P(s.fails / s.meas)))}</span><p>${esc(t("t_" + s.k))}</p></div>`;
    h += `</div>`;
  }

  // injury-risk patterns in this session
  const statMap = {}; stats.forEach(x => statMap[x.k] = { fail: x.fails, meas: x.meas });
  const risks = riskNotes(k => statMap[k]);
  if (risks.length) h += `<h2>${esc(t("dRisk"))}</h2>${riskHTML(risks)}<p class="note-sm">${esc(t("dRiskNote"))}</p>`;

  // 3. pass rate per check
  h += `<h2>${esc(t("rpRates"))}</h2><div class="rates">`;
  for (const s of stats){
    const low = s.rate != null && s.rate < 0.7;
    h += `<div>${esc(t("n_" + s.k))}</div><div class="bar"><span style="width:${s.rate == null ? 0 : s.rate * 100}%"></span></div>`;
    h += `<div class="pct${low ? " low" : ""}">${s.rate == null ? esc(t("notMeasured")) : P(s.rate) + (low ? " · " + esc(t("needWork")) : "")}</div>`;
  }
  h += `</div>`;

  // 4. long-term trend
  const hist = ctx.hist || [];
  h += `<h2>${esc(t("rpTrend"))}</h2><div class="trend">`;
  if (hist.length < 2) h += `<p class="note-sm">${esc(t("trendNeedMore"))}</p>`;
  else {
    const hs = hist.slice(-12);
    h += `<p class="cap">${esc(t("trendChart"))}</p>${trendSVG(hs, sessionId)}`;
    const cols = hist.slice(-8);
    h += `<div class="heat-wrap"><p class="cap">${esc(t("trendTable"))}</p><table class="heat"><tr><th></th>`;
    for (const c of cols) h += `<th>${esc(c.id === sessionId ? t("thisSession") : fShort(c.start))}</th>`;
    h += `</tr>`;
    for (const k of rateKeys(M)){
      h += `<tr><td>${esc(t("n_" + k))}</td>`;
      for (const c of cols){
        const m = (c.meas || {})[k] || 0, f = (c.fails || {})[k] || 0;
        if (!m){ h += `<td style="color:var(--muted)">—</td>`; continue; }
        const r = (m - f) / m;
        h += `<td style="background:color-mix(in srgb, var(--accent) ${Math.round(8 + r * 50)}%, var(--surface))">${P(r)}</td>`;
      }
      h += `</tr>`;
    }
    h += `</table></div>`;
  }
  h += ctx.cloud ? `<p class="note-sm">${esc(t("cloudHistoryNote"))}</p></div>`
                 : `<p class="note-sm">${esc(t("historyNote"))} <button class="no-print" id="rpClear" style="padding:2px 8px;font-size:12px">${esc(t("clearHistory"))}</button></p></div>`;

  // 5. every tendu with keyframes
  const CAP = 40, shown = reps.slice(-CAP);
  h += `<h2>${esc(t("rpDetail"))}</h2>`;
  if (n > CAP) h += `<p class="note-sm">${esc(t("detailCap", CAP))}</p>`;
  shown.forEach((r, i) => {
    const ok = !r.errors.length;
    h += `<div class="rp-rep"><div class="hd"><span>${esc(t("repHead", r.n, dirName(r.dir), t(r.side), fTime(r.at)))}</span>`;
    h += `<span class="${ok ? "ok" : "bad"}">${ok ? "✓ " + esc(t("allPassed")) : "✗ " + r.errors.length}</span></div>`;
    if (r.snaps.start || r.snaps.far || r.snaps.close){
      h += `<div class="snaps">`;
      for (const [key, cap] of (M === "plie" ? [["start", "snapStart"], ["far", "axBottom"], ["close", "axUp"]] : [["start", "snapStart"], ["far", "snapFar"], ["close", "snapClose"]]))
        h += `<figure>${r.snaps[key] ? `<img src="${r.snaps[key]}" alt="${esc(t(cap))}">` : ""}<figcaption>${esc(t(cap))}</figcaption></figure>`;
      h += `</div>`;
    }
    h += `<div class="timeline" data-rep="${shown.length - 1 - i}"></div>`;
    if (!ok){
      h += `<ul>`;
      for (const k of r.errors) h += `<li>${esc(t("n_" + k))}${r.R[k] ? `<span class="v">${esc(fmt(r.R[k])[1])}</span>` : ""}</li>`;
      h += `</ul>`;
    }
    h += `</div>`;
  });
  h += `<div class="rp-foot">${esc(t("generated", new Date().toLocaleString(locale())))} · ${esc(t("title"))}</div></article>`;

  const el = $("report"); el.innerHTML = h;
  el.querySelectorAll(".timeline[data-rep]").forEach(tl => { const r = shown[shown.length - 1 - +tl.dataset.rep]; fillTimeline(tl, r.segs, r.peak); });
  $("rpBack").addEventListener("click", () => document.body.classList.remove("show-report"));
  $("rpPrint").addEventListener("click", () => window.print());
  if ($("rpClear")) $("rpClear").addEventListener("click", () => {
    if (!confirm(t("confirmClear"))) return;
    try { localStorage.removeItem(HKEY); } catch {}
    saveHistory(); ctx.hist = loadHistory(); renderReport(ctx);
  });
}

const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

function setAcctMsg(key, arg){ acctMsg = key ? [key, arg] : null; $("acctMsg").textContent = key ? t(key, arg) : ""; }

// sign-in gate: "loading" | "email" | "code" | "child" | null (app visible)
let gateStep = null, gateMsg = null, lastEmail = "", resendAt = 0, resendTimer = 0;
function gate(step){
  gateStep = step;
  document.body.classList.toggle("show-gate", !!step);
  for (const [id, st] of [["gLoading", "loading"], ["gEmail", "email"], ["gCode", "code"], ["gChild", "child"]]) $(id).hidden = st !== step;
  const focus = { email: "email", code: "code", child: "childName" }[step];
  if (focus) setTimeout(() => $(focus).focus(), 50);
}
function setGateMsg(key, arg, ok){
  gateMsg = key ? [key, arg, ok] : null;
  $("gateMsg").textContent = key ? t(key, arg) : "";
  $("gateMsg").classList.toggle("ok", !!ok);
}
function renderGate(){
  if (gateMsg) setGateMsg(...gateMsg);
  if (lastEmail) $("codeSentMsg").textContent = t("codeSent", lastEmail);
  tickResend();
}
function tickResend(){
  const left = Math.ceil((resendAt - Date.now()) / 1000), b = $("resendCode");
  b.disabled = left > 0;
  b.textContent = left > 0 ? t("resendIn", left) : t("resend");
  clearTimeout(resendTimer);
  if (left > 0) resendTimer = setTimeout(tickResend, 1000);
}
async function sendCodeTo(email){
  const { error } = await cloud.sb.auth.signInWithOtp({ email, options: { shouldCreateUser: CONF.allowSignup !== false } });
  if (error){
    const invite = /signup|not allowed|not found/i.test(error.message || "");
    setGateMsg(invite ? "inviteOnly" : "authErr", error.message);
    return false;
  }
  lastEmail = email; resendAt = Date.now() + 60000; tickResend();
  return true;
}

async function cloudInit(){
  if (!cloud.enabled) return;
  gate("loading");
  try { if (!window.supabase) await loadScript(SUPA_JS); }
  catch(e){ gate(null); setAcctMsg("authErr", e.message); return; }       // offline: let the app work device-only
  cloud.sb = window.supabase.createClient(CONF.supabaseUrl, CONF.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true } });
  // run Supabase calls outside the auth callback (calling it from inside can deadlock)
  cloud.sb.auth.onAuthStateChange((_ev, session) => setTimeout(() => onUser(session ? session.user : null), 0));
}
async function onUser(user){
  const changed = (user && user.id) !== (cloud.user && cloud.user.id);
  cloud.user = user;
  if (!user){
    if (reps.length) newSession();
    cloud.dancers = []; cloud.dancerId = null; renderAcct(); loadHistoryList(); gate("email"); return;
  }
  if (changed){ gate("loading"); await loadDancers(); } else renderAcct();
  gate(cloud.dancers.length ? null : "child");
}
async function loadDancers(){
  const { data, error } = await cloud.sb.from("dancers").select("id,name").order("created_at");
  if (error){ setAcctMsg("authErr", error.message); setGateMsg("authErr", error.message); return; }
  cloud.dancers = data || [];
  const saved = lsGet("ballet-dancer");
  cloud.dancerId = (cloud.dancers.find(d => d.id === saved) || cloud.dancers[0] || {}).id || null;
  renderAcct(); loadHistoryList(); flushSoon();
  if (document.body.classList.contains("view-diary")) renderDiary();
}
function renderAcct(){
  if (!cloud.enabled) return;
  const inn = !!cloud.user;
  $("acctCard").hidden = !inn; $("acctIn").hidden = !inn;
  if (inn){
    $("whoami").textContent = t("signedInAs", cloud.user.email || "");
    const sel = $("dancerSel"); sel.innerHTML = "";
    for (const d of cloud.dancers){ const o = document.createElement("option"); o.value = d.id; o.textContent = d.name; sel.appendChild(o); }
    sel.value = cloud.dancerId || ""; sel.disabled = !cloud.dancers.length;
    if (!cloud.dancers.length) setAcctMsg("needDancer");
    else if (acctMsg && acctMsg[0] === "needDancer") setAcctMsg(null);
  }
  if (acctMsg) $("acctMsg").textContent = t(acctMsg[0], acctMsg[1]);
  renderSync();
}
function renderSync(){
  const el = $("syncState");
  el.className = "";
  if (!cloudReady()){ el.textContent = ""; return; }
  if (cloud.errored){ el.textContent = t("syncErr"); el.className = "err"; }
  else if (cloud.queue.length) el.textContent = t("syncPending", cloud.queue.length);
  else { el.textContent = t("syncOk"); el.className = "ok"; }
}

$("sendCode").addEventListener("click", async () => {
  const email = $("email").value.trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ setGateMsg("badEmail"); return; }
  if (!cloud.sb) return;
  $("sendCode").disabled = true;
  const ok = await sendCodeTo(email);
  $("sendCode").disabled = false;
  if (!ok) return;
  setGateMsg(null); $("code").value = "";
  $("codeSentMsg").textContent = t("codeSent", email);
  gate("code");
});
$("resendCode").addEventListener("click", async () => {
  if (Date.now() < resendAt || !lastEmail) return;
  if (await sendCodeTo(lastEmail)) setGateMsg("codeResent", null, true);
});
$("changeEmail").addEventListener("click", () => { setGateMsg(null); gate("email"); });
$("verifyCode").addEventListener("click", async () => {
  const token = $("code").value.replace(/\s/g, "");
  if (!lastEmail || !token) return;
  $("verifyCode").disabled = true;
  const { error } = await cloud.sb.auth.verifyOtp({ email: lastEmail, token, type: "email" });
  $("verifyCode").disabled = false;
  if (error){ setGateMsg("badCode"); return; }
  setGateMsg(null); gate("loading");                      // onAuthStateChange takes it from here
});
$("addChild").addEventListener("click", async () => {

  $("addChild").disabled = true;

});
